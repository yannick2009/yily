# Yily — nginx configuration (mounted into the container as conf.d/default.conf).
#
# Adjust `server_name` and check the certificate paths before starting.
# TLS certificates are NOT generated by nginx: provide them yourself (certbot…).

# --- HTTP → HTTPS redirect ----------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name yily.example.com;

    return 301 https://$host$request_uri;
}

# --- Web UI + API over HTTPS --------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yily.example.com;

    # Certificates mounted from ./certs (see docker-compose.yml).
    # With certbot on the host, you can also point directly at:
    #   /etc/letsencrypt/live/yily.example.com/fullchain.pem
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Matches the server's BodyLimit (1 MB).
    client_max_body_size 1m;

    location / {
        proxy_pass http://yily:52015;
        proxy_http_version 1.1;

        # Proxy headers. `X-Forwarded-Proto` is required so the server marks the
        # session cookie as Secure (it honors it only from a private/loopback
        # address, which is the case for the proxy).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }
}
